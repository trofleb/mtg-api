name: CI

on:
  push:
    branches: [main, develop]
  pull_request:
    branches: [main, develop]

jobs:
  changes:
    runs-on: ubuntu-latest
    # Required permissions for paths-filter
    permissions:
      pull-requests: read
    outputs:
      backend: ${{ steps.filter.outputs.backend }}
      web-app: ${{ steps.filter.outputs.web-app }}
      scripts: ${{ steps.filter.outputs.scripts }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Check for file changes
        uses: dorny/paths-filter@v3
        id: filter
        with:
          filters: |
            backend:
              - 'api/**'
              - 'tasks/**'
              - 'common/**'
              - 'tests/**'
              - 'pyproject.toml'
              - 'uv.lock'
              - '.github/workflows/ci.yml'
              # Both are needed for the staleness gate below to be unbypassable.
              # Without them a commit touching only openapi.json skips this job,
              # so generate_openapi.py --check never runs -- and the web-app job
              # then regenerates its types from the tampered document and passes.
              - 'openapi.json'
              - 'scripts/**'
            web-app:
              - 'web-app/**'
              - 'openapi.json'
              - '.github/workflows/ci.yml'
            scripts:
              - 'scripts/**'
              - 'common/**'
              - 'pyproject.toml'
              - 'uv.lock'
              - '.github/workflows/ci.yml'

  test:
    needs: changes
    if: ${{ needs.changes.outputs.backend == 'true' }}
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install uv
        uses: astral-sh/setup-uv@v3
        with:
          enable-cache: true

      - name: Setup Python
        run: uv python install 3.13

      - name: Install dependencies
        run: uv sync --frozen --extra dev --extra tests

      - name: Lint
        run: uv run ruff check --exclude "notebooks/**" .

      - name: Format check
        run: uv run ruff format --check --exclude "notebooks/**" .

      # The committed openapi.json is what the web app generates its types
      # and its request stub from, so a stale one is a contract describing an
      # API that no longer exists. Regenerate from this PR's code and fail on
      # any difference.
      - name: Check the committed OpenAPI document is current
        run: uv run python scripts/generate_openapi.py --check

      - name: Test
        run: uv run pytest --cov --cov-report=xml

      - name: Upload coverage
        uses: codecov/codecov-action@v3
        with:
          file: ./coverage.xml
          fail_ci_if_error: false

  test-web-app:
    needs: changes
    if: ${{ needs.changes.outputs.web-app == 'true' }}
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 10.14.0
          run_install: false

      - name: Get pnpm store directory
        shell: bash
        run: echo "STORE_PATH=$(pnpm store path --silent)" >> $GITHUB_ENV

      - name: Setup pnpm cache
        uses: actions/cache@v4
        with:
          path: ${{ env.STORE_PATH }}
          key: ${{ runner.os }}-pnpm-store-${{ hashFiles('**/pnpm-lock.yaml') }}
          restore-keys: |
            ${{ runner.os }}-pnpm-store-

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "20"

      - name: Install dependencies
        working-directory: web-app
        run: pnpm install --frozen-lockfile

      - name: Lint
        working-directory: web-app
        run: pnpm run check

      # lib/api-types.ts is generated from the committed openapi.json. It is
      # committed too, so tsc has a schema on a frontend-only PR where the
      # backend job never runs - which only holds if the two stay in step.
      - name: Check the generated API types are current
        working-directory: web-app
        run: |
          pnpm run generate:api-types
          git diff --exit-code lib/api-types.ts

      - name: Type check
        working-directory: web-app
        run: pnpm run typecheck

      - name: Run unit tests
        working-directory: web-app
        run: pnpm run test:run

      # Vitest Browser Mode drives a real Chromium: jsdom has no layout engine,
      # so anything asserting a size, a real drag or real focus lives here.
      - name: Install Playwright Chromium
        working-directory: web-app
        run: pnpm exec playwright install --with-deps chromium

      - name: Run component tests (Browser Mode)
        working-directory: web-app
        run: pnpm run test:browser

  scripts-test:
    needs: changes
    if: ${{ needs.changes.outputs.scripts == 'true' }}
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install uv
        uses: astral-sh/setup-uv@v3
        with:
          enable-cache: true
          cache-dependency-glob: "uv.lock"

      - name: Setup Python
        run: uv python install 3.13

      - name: Install dependencies
        run: uv sync --frozen

      - name: Test scripts
        run: |
          uv run python scripts/mtg_events.py --help
          uv run python scripts/mtg_events.py test-connection
